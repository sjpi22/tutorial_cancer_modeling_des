# Configurations for decision model and calibration

# General file paths
paths:
  root_dir: # Root directories
    data: "data"
    output: "output/bladder"
    figs: "figs/bladder"
  file_params_calib: "output/bladder/params_calib_updated.rds" # File to save list of calibration parameters updated with cohort size
  file_plot_labels: "data/target_plot_labels.csv" # File path with plot labels for calibration targets and outcomes
  files_coverage: # File names for coverage analysis outputs
    output:
      coverage: "coverage_initial.rds"
    figs:
      coverage: "coverage_initial.png"
  files_baycann: # File names for BayCANN outputs
    none:
      model: "analysis/02_BayCANN/model.R"
      stan: "stan/post_multi_perceptron_flex.stan"
    output:
      sample: "baycann_sample.rds"
      runs: "baycann_runs"
      logs: "baycann_logs"
      run_best: "baycann_run_best"
      keras_model: "baycann_keras_model.keras"
      test_outputs: "baycann_test_outputs.rds"
      stan_model: "baycann_stan_model.rds"
      posterior: "baycann_posterior.csv"
      baycann_stats: "baycann_stats.rds"
      outputs: "baycann_decision_outputs.rds"
    figs:
      coverage: "baycann_coverage.png"
      history: "baycann_ann_history.png"
      ann_valid: "baycann_ann_validation.png"
      trace: "baycann_stan_trace.png"
      chains: "baycann_stan_chains.png"
      corr: "baycann_corr.png"
      prior_post: "baycann_prior_post.png"
      validation: "baycann_target_validation.png"
  files_imabc: # File names for IMABC outputs
    output:
      samples: "imabc_samples"
      posterior: "imabc_posterior.rds"
      runtime: "imabc_runtime.csv"
      outputs: "imabc_decision_outputs.rds"
    figs:
      corr: "imabc_corr.png"
      prior_post: "imabc_prior_post.png"
      validation: "imabc_target_validation.png"
  files_decision: # File names for decision and intermediate outcomes
    output:
      nathist: "nathist_outputs.csv"
    figs:
      decision: "decision_outputs.png"
  files_tests: # File names for unit tests
    figs:
      prior_cdf: "test_prior_cdf.pdf"
      prior_onset: "test_prior_onset.pdf"
      
# Model parameters (inputs to load_model_params() in R/01_load_model_inputs.R)
params_model:
  lesion_state: FALSE      # Indicator to include precancerous lesion state
  sex: "both"
  v_cancer: [1, 2, 3]  # Cancer stages in order
  v_cancer_surv: ["localized", "regional", "distant"] # Cancer survival categories in order
  conf_level: 0.95        # Confidence level for outputs
  year_base: 1933         # Base year for background mortality rates
  file.mort: # File path(s) for background mortality data
    both: "data/general/HMD_lifetables/bltper_1x1.txt"
  file.surv: # File path for relative survival from cancer diagnosis data
    localized: "data/bladder/SEER_Explore/bladder_surv_localized.csv"
    regional: "data/bladder/SEER_Explore/bladder_surv_regional.csv"
    distant: "data/bladder/SEER_Explore/bladder_surv_distant.csv"

# Prior parameters
params_priors:
  v_state_targets: 
    C: "incidence_clin"
    P: "prevalence_preclin"
  multiplier_bounds: 0.5 # Factor by which to expand estimated prior bounds
  var_index: "target_index" # Column name of index (e.g., age) associated with target
  v_cols: # Names of columns in target data for target, lower bound, and upper bound
    - "targets" 
    - "ci_lb"
    - "ci_ub"
  v_colors: # Colors to label states listed in v_state_targets
    - "green"
    - "red"
  delta: 0.5
  penalty1: 0
  penalty2: 0

# Calibration parameters (inputs to load_calib_params() in R/03_calibration_general_functions.R after modifications in configs/process_configs.R for lesion model)
params_calib:
  seed_calib: 42
  file_priors: "data/bladder/priors.csv" # File path for prior distributions for calibration parameters
  file_targets: "data/bladder/targets.xlsx" # File path for calibration targets
  l_params_outcome: # Parameters for calculating calibration outcomes
    prevalence_preclin:
      outcome_type: "prevalence"
      categorical: FALSE
      get_params:
        m_patients: "m_patients"
      lit_params:
        start_var: "time_H_P"
        end_var: "time_H_C"
        censor_var: "time_H_D"
        condition_var: "time_H_P"
        method: "cs"
        sample_var: "time_H_D"
    incidence_clin:
      outcome_type: "incidence"
      categorical: FALSE
      get_params:
        m_patients: "m_patients"
      lit_params:
        time_var: "time_H_C"
        censor_var: "time_H_D"
        method: "long"
        rate_unit: 100000
    stage_distr:
      outcome_type: "distr"
      categorical: TRUE
      get_params:
        m_patients: "m_patients"
      lit_params:
        grouping_var: "stage_dx"
        event_var: "time_H_C"
        censor_var: "time_H_D"
  l_censor_vars:
    m_patients:
      time_screen_censor: ["time_H_C", "time_H_D"]
        
# Parameters for Monte Carlo analysis to set sample size
params_montecarlo:
  n_init: 500000
  n_mc_reps: 60
  mc_multiplier: 2
  
# Parameters for initial coverage analysis and internal validation
params_coverage:
  check_coverage: TRUE # Indicator to (re)run coverage analysis
  n_samp_coverage: 100
  v_quantiles: [50, 95]
  plt_size_text: 18

# Parameters specific to IMABC
params_imabc:
  alpha_current: 1.0e-15
  alpha_stop: 0.05
  fn_use_seed: FALSE
  N_start_multiplier: 500 # Number of initial samples per parameter
  vars_rate: "incidence_clin" # Target group names for any targets calculated as rates instead of proportions
  optional_args:
    N_centers: 5
    N_post: 1000
    max_iter: 1200

# Parameters specific to BayCANN
params_baycann:
  params_sampling: # Parameters for sampling from priors
    n_samp_per_param: 300 # Number of samples per parameter; try 100 on desktop or 1000 if you can run on a computing cluster
  params_data: # Parameters for data preparation
    scale_type: 3 # 1: scale from -1 to 1; 2: standardization; 3: scale from 0 to 1
    train_split: 0.8 # Train vs. test split
    valid_split: 0.8 # Train vs. validation within train set for hyperparameter tuning
    Normalize_outputs: FALSE  # TRUE if we want to normalize outputs 
    Scale_inputs: TRUE   # TRUE if we want to scale inputs
    Scale_outputs: TRUE   # TRUE if we want to scale outputs 
    Scale_categorical: FALSE # TRUE if we want to scale categorical variables and not constrain proportions to sum to 1
    Remove_outliers: FALSE  # TRUE if we want to remove outliers
    Standardize_targets: FALSE  # TRUE if we want to standardize targets
    Saved_data: FALSE  # TRUE if we want to saved the data
    Selected_targets: FALSE  # TRUE if we want to use an specific list of calibration targets
  params_ann: # Parameters for training ANN
    verbose: 0
    n_batch_size: 128
    n_epochs: 1000
    patience: 100
    init_W_type: 0
  params_hyperparameters: # Parameters for ANN hyperparameter tuning
    run_hp_tuning: TRUE # Indicator to run hyperparameter tuning; if FALSE, train model with the first hyperparameter set
    confirm_hp: FALSE # Indicator to show confirmation prompt when hyperparameter tuning
    v_hidden_layers: [1, 2, 3, 4]
    v_hidden_nodes: [32, 64, 128]
    v_dropout: [TRUE, FALSE]
    v_dropout_rate: [0.25]
    v_activation_fun: ["relu", "tanh", "sigmoid"]
    p_hp_sample: 0.3 # Proportion of hyperparameter possibilities to sample
  params_stan: # Parameters for Bayesian calibration with Stan
    n_iter: 300000
    n_thin: 100
    n_chains: 4
    validate_stan_model: TRUE
    eps_stan: 0.0001
  
# Parameters for screening strategy evaluation
params_screen:
  l_outcome_base: # Outcomes to add for base and screening scenario
    lifeyears:
      outcome_type: "lifeyears"
      get_params:
        m_patients: "m_patients"
      lit_params:
        sum_var: "time_H_D"
        censor_var: "time_screen_censor"
        min_age: 40
    ntests:
      outcome_type: "ntests"
      get_params:
        m_patients: "m_patients"
      lit_params:
        censor_var: "time_screen_censor"
        min_age: 40
    dwell_time:
      outcome_type: "dwell_time"
      get_params:
        m_patients: "m_patients"
      lit_params:
        start_var: "time_H_L"
        end_var: "time_H_P"
        event_var: "time_H_P"
        censor_var: "time_H_D"
    sojourn_time:
      outcome_type: "dwell_time"
      get_params:
        m_patients: "m_patients"
      lit_params:
        start_var: "time_H_P"
        end_var: "time_H_C"
        event_var: "time_H_C"
        censor_var: "time_H_D"
  l_outcome_counterfactual: # Outcomes comparing screening and no-screening scenarios
    lyg:
      outcome_type: "lyg"
      input_outcome: "lifeyears"
      lit_params:
        unit: 1000
  test_chars: # Test characteristics
    confirm:
      d_p_sens:
        L:
          distr: "beta"
          params:
            shape1: 150
            shape2: 50
        P: 
          distr: "beta"
          params:
            shape1: 99
            shape2: 1
      d_p_spec:
        distr: "beta"
        params:
          shape1: 100
          shape2: 0
      type: "direct"
      cost_ratio: 1
    screen:
      d_p_sens:
        L:
          distr: "beta"
          params:
            shape1: 80
            shape2: 120
        P: 
          distr: "beta"
          params:
            shape1: 45
            shape2: 5
      d_p_spec:
        distr: "beta"
        params:
          shape1: 840
          shape2: 160
      type: "indirect"
      cost_ratio: 0.1
  strats: # Screening test strategies 
    strategy_c_int5:
      mod: "confirm"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 5
      mod_conf: ~
    strategy_c_int10:
      mod: "confirm"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 10
      mod_conf: ~
    strategy_c_int20: # Effectively two-time screening at age 50 and 70
      mod: "confirm"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 20
      mod_conf: ~
    strategy_c_int30: # Effectively one-time screening at age 50
      mod: "confirm"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 30
      mod_conf: ~
    strategy_s_int1:
      mod: "screen"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 1
      mod_conf: "confirm"
      int_conf: 10
    strategy_s_int3:
      mod: "screen"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 3
      mod_conf: "confirm"
      int_conf: 10
    strategy_s_int5:
      mod: "screen"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 5
      mod_conf: "confirm"
      int_conf: 10
    strategy_s_int10:
      mod: "screen"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 10
      mod_conf: "confirm"
      int_conf: 10
    strategy_s_int20: # Effectively two-time screening at age 50 and 70
      mod: "screen"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 20
      mod_conf: "confirm"
      int_conf: 20
    strategy_s_int30: # Effectively one-time screening at age 50
      mod: "screen"
      age_screen_start: 50
      age_screen_stop: 71
      int_screen: 30
      mod_conf: "confirm"
      int_conf: 30
  surveil: # Surveillance regimen
    mod: "confirm"
    n_detected: [3, 1]
    int_surveil: [3, 7]
    mod_conf: ~
